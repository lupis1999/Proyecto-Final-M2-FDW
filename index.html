<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seleccionar servicios</title>
    <link rel="icon"  href="./img/logos/favicon.ico.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="profiles-page">
    <header class="profiles-header">
        <div class="logo" role="img">
            
            <img src="./img/logos/tacos-plus-logo.png.png" alt="logo taqueria">
        
        </div>
    </header>
    <main class="profiles-main">
        <h1 class="profiles-title">Selecciona los servicios que deseas</h1>
        <section class="profiles-grid">
                <button class="profiles-card" type="button" onclick="window.location.href='./home.html'">
                    <img src="./img/profile1.png" alt="Perfil 1" width="200"height="200">
                    <h2>Servicio 1</h2>

            </button>

            <button class="profiles-card" type="button" >
                    <img src="./img/profile2.png" alt="Perfil 2"width="200"height="200">
                    <h2>Servicio 2</h2>

            </button>

            <button class="profiles-card add-profile" type="button" disabled>
                    <div class="add-circle"><img src=".//img/logos/plus.png" alt="logo taqueria"></div>
                    <h2>Agregar</h2>
                    
                  

            </button>

            <p class="profiles-hint">Descripción del servicio</p>
        </section>
    </main>
</body>
</html>
