<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>seleccionar servicios</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico.png">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="profiles-page">
    <header class="profiles-header">
        <div class="dplus-mark">
            <span class="dplus-text">Taqueria</span>
        </div>
    </header>
    <main class="profiles-main">
        <h1 class="profiles-title">Selecciona los servicios que deseas</h1>
        <section class="profiles-grid">
            <button class="profiles-card" type="button">
                    <img src="./img/profile1.jpg.jpg" alt="Perfil 1" width="100"height="100">
                    <h2>Servicio 1</h2>

            </button>

            <button class="profiles-card" type="button">
                    <img src="./img/profile2.jpg.jpg" alt="Perfil 2"width="100"height="100">
                    <h2>Servicio 2</h2>

            </button>

            <button class="profiles-card" type="button">
                    <div class="add-profile">+</div>
                    <h2>Servicio 3</h2>

            </button>

            <p class="profiles-hint">Descripción del servicio</p>
        </section>
    </main>
</body>
</html>
